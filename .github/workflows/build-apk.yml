name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate debug keystore for CI
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -keyalg RSA -keysize 2048 -validity 10000 -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK
        run: flutter build apk --no-tree-shake-icons --target-platform android-arm64

      - name: Verify app-settings path in binary
        run: |
          strings build/app/outputs/flutter-apk/app-release.apk | grep "app-settings" || true
          if strings build/app/outputs/flutter-apk/app-release.apk | grep -q "api/v1/api/v1/app-settings"; then
            echo "Found duplicated app-settings path in binary"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: layn-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
